<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Drumul până la simularea Evaluării Naționale 2027</title>
  <desc id="d">Cronologie: vacanța de iarnă 23 decembrie – 10 ianuarie, vacanța mobilă între 15 februarie și 7 martie, simularea 16–18 martie, rezultatele pe 30 martie, examenul pe 22 iunie 2027.</desc>
  <style>
    .bg{fill:#f7f5ff}.ax{stroke:#c9c2ef;stroke-width:6;stroke-linecap:round}
    .done{stroke:#6d4fd8;stroke-width:6;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:fill 6s ease-in-out infinite}
    .lbl{font:600 15px system-ui,Segoe UI,Arial,sans-serif;fill:#26214a}
    .sm{font:13px system-ui,Segoe UI,Arial,sans-serif;fill:#5b5680}
    .hd{font:700 20px system-ui,Segoe UI,Arial,sans-serif;fill:#26214a}
    .pt{fill:#fff;stroke:#6d4fd8;stroke-width:4}
    .key{fill:#ff7a45;stroke:#fff;stroke-width:3}
    .pulse{fill:none;stroke:#ff7a45;stroke-width:3;transform-origin:520px 160px;animation:p 1.6s ease-out infinite}
    @keyframes fill{0%{stroke-dashoffset:460}70%,100%{stroke-dashoffset:0}}
    @keyframes p{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
  </style>
  <rect class="bg" width="800" height="300" rx="18"/>
  <text class="hd" x="40" y="50">De azi până la simulare: aproape 4 luni</text>
  <line class="ax" x1="60" y1="160" x2="740" y2="160"/>
  <line class="done" x1="60" y1="160" x2="520" y2="160"/>
  <circle class="pt" cx="60" cy="160" r="10"/>
  <text class="lbl" x="40" y="200">20 nov.</text><text class="sm" x="40" y="220">începi aici</text>
  <circle class="pt" cx="220" cy="160" r="10"/>
  <text class="lbl" x="170" y="125">23 dec. – 10 ian.</text><text class="sm" x="180" y="105">vacanța de iarnă</text>
  <circle class="pt" cx="400" cy="160" r="10"/>
  <text class="lbl" x="350" y="200">15 feb. – 7 mar.</text><text class="sm" x="335" y="220">vacanța mobilă (o săpt.)</text>
  <circle class="pulse" cx="520" cy="160" r="12"/>
  <circle class="key" cx="520" cy="160" r="12"/>
  <text class="lbl" x="470" y="125">16–18 martie</text><text class="sm" x="485" y="105">SIMULAREA</text>
  <circle class="pt" cx="600" cy="160" r="10"/>
  <text class="lbl" x="570" y="200">30 martie</text><text class="sm" x="575" y="220">rezultate</text>
  <circle class="pt" cx="740" cy="160" r="10"/>
  <text class="lbl" x="690" y="125">22 iunie</text><text class="sm" x="700" y="105">EN română</text>
  <circle r="7" fill="#6d4fd8"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear" path="M60,160 L520,160"/></circle>
  <text class="sm" x="40" y="275">Date din calendarul oficial al Ministerului Educației și structura anului școlar 2026-2027.</text>
</svg>
