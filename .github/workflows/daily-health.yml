name: Daily regression and production health
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Unit regression tests
        run: bun test
      - name: Production SEO and availability (read-only)
        run: python3 scripts/health-check.py > health-report.json
      - name: Install test browser
        run: bunx playwright install --with-deps chromium
      - name: UI regression (mocked auth and uploads, not provider verification)
        run: bunx playwright test
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-health-results
          path: |
            health-report.json
            test-results/
          retention-days: 14
      - name: Notify repository subscribers on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Daily MeditatiiDirect health check failed';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', per_page: 100});
            const body = `Verification failed. Review the sanitized report and tests: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Real Google OAuth/email confirmation are not verified by mocked tests.`;
            const issue = issues.find(i => i.title === title && !i.pull_request);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body});