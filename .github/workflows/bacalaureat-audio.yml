name: bacalaureat-audio
on:
  push:
    branches: [feature/demo-video-rotativ]
    paths: [.github/workflows/bacalaureat-audio.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/demo-video-rotativ
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts
      - name: BAC -> bacalaureat in video content
        run: |
          f=src/components/profesor-ai/demo-repertoriu.ts
          sed -i -E 's/nivel: "BAC · /nivel: "Bacalaureat · /; s/nivel: "BAC",/nivel: "Bacalaureat",/; s/complet la BAC\./complet la bacalaureat./' $f
          sed -i 's/Pregătire pentru BAC sau test/Pregătire pentru bacalaureat sau test/' src/components/profesor-ai/demo-rotativ.tsx
          sed -i 's/Așa se punctează complet la BAC\.": "\(.*\)complet la bac\."/Așa se punctează complet la bacalaureat.": "\1complet la bacalaureat."/' scripts/genereaza-audio-demo.py
          sed -i 's/baremul de la BAC\./baremul de la bacalaureat. Spune mereu „bacalaureat”, niciodată prescurtarea „BAC”./' src/lib/profesor-ai.functions.ts
          sed -i 's/baremul de BAC\./baremul de la bacalaureat. Spune mereu „bacalaureat”, niciodată prescurtarea „BAC”./' src/lib/profesor-ai-tutor.server.ts
          sed -i 's/până la liceu și BAC,/până la liceu și bacalaureat,/' src/routes/profesor-ai.index.tsx
          ! grep -nw "BAC" $f src/components/profesor-ai/demo-rotativ.tsx
      - name: Regenerate voiced demo lessons
        run: |
          bun install || true
          rm -f public/demo-lectii/*.mp3
          python3 scripts/genereaza-audio-demo.py
          bun test src/components/profesor-ai
      - name: Commit
        run: |
          git rm -q .github/workflows/bacalaureat-audio.yml
          git config user.name alexalghisi
          git config user.email alexalghisi@gmail.com
          git add -A src scripts public/demo-lectii
          git commit -q -m "Demo Profesor AI: spune „bacalaureat”, nu „BAC”"
          git push
